<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mahkus — Links</title>
  <meta name="description" content="All of Mahkus's links in one place." />
  <meta property="og:title" content="Mahkus — Links" />
  <meta property="og:description" content="Referrals, YouTube, and more." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23111827'/%3E%3Ctext x='50' y='68' text-anchor='middle' font-size='52'%3E🔗%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      color-scheme: dark;
      --text: #f5f7ff;
      --muted: #c9c2b6;
      --accent: #f0a35a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      position: relative;
      isolation: isolate;
      min-height: 100vh;
      background: #120e0b;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background: url("bg.jpg") center / cover no-repeat;
      transform: scale(1.03);
      filter: saturate(1.08) contrast(1.04) brightness(1.08);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      /* Lighter warm sunset wash — keep readable but brighter */
      background:
        linear-gradient(180deg, rgba(18, 12, 8, 0.22) 0%, rgba(12, 14, 18, 0.38) 40%, rgba(8, 10, 14, 0.72) 100%),
        radial-gradient(900px 520px at 50% 0%, rgba(255, 150, 70, 0.16), transparent 58%),
        radial-gradient(700px 420px at 20% 90%, rgba(255, 110, 50, 0.08), transparent 55%),
        radial-gradient(600px 380px at 90% 80%, rgba(70, 110, 160, 0.08), transparent 50%);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }

    .wrap {
      width: min(420px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2.75rem 0 3rem;
    }

    .panel {
      padding: 1.35rem 1.15rem 1.25rem;
      border-radius: 24px;
      background: rgba(20, 16, 14, 0.48);
      border: 1px solid rgba(255, 210, 160, 0.14);
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 220, 180, 0.08);
      backdrop-filter: blur(18px) saturate(130%);
      -webkit-backdrop-filter: blur(18px) saturate(130%);
    }

    header {
      text-align: center;
      margin-bottom: 1.35rem;
    }

    .avatar {
      width: 96px;
      height: 96px;
      margin: 0 auto 1rem;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.18);
      box-shadow:
        0 0 0 6px rgba(240, 163, 90, 0.16),
        0 16px 40px rgba(0, 0, 0, 0.45);
      background: #161d2e;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    h1 {
      margin: 0;
      font-size: 1.6rem;
      font-weight: 750;
      letter-spacing: -0.03em;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.45);
    }

    .bio {
      margin: 0.5rem 0 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
    }

    .links {
      display: grid;
      gap: 0.8rem;
    }

    a.link {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.98rem 1.05rem;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
      transition: background 0.18s ease, transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }

    a.link:hover {
      background: rgba(240, 163, 90, 0.12);
      border-color: rgba(240, 163, 90, 0.42);
      transform: translateY(-2px);
      box-shadow:
        0 10px 28px rgba(0, 0, 0, 0.35),
        0 0 0 3px rgba(240, 163, 90, 0.16);
    }

    a.link:active { transform: translateY(0); }

    a.link:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(240, 163, 90, 0.35);
    }

    .emoji {
      width: 1.75rem;
      text-align: center;
      font-size: 1.2rem;
      flex-shrink: 0;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.35));
    }

    .copy { min-width: 0; }

    .label {
      display: block;
      font-weight: 650;
      font-size: 0.98rem;
      line-height: 1.25;
    }

    .sub {
      display: block;
      margin-top: 0.15rem;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.3;
    }

    footer {
      margin-top: 1.35rem;
      text-align: center;
      color: rgba(201, 194, 182, 0.85);
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="panel">
      <header>
        <div class="avatar"><img src="avatar.jpg" alt="Mahkus" width="96" height="96" /></div>
        <h1>Mahkus</h1>
        <p class="bio">Solar, batteries, EVs — and the links that go with them.</p>
      </header>

      <!-- Edit this list: label, url, emoji, optional subtitle -->
      <nav class="links" id="links" aria-label="Links"></nav>

      <footer></footer>
    </div>
  </main>

  <script>
    // ===== EDIT YOUR LINKS HERE =====
    const PROFILE = {
      name: "Mahkus",
      bio: "Solar, batteries, EVs — and the links that go with them.",
      avatar: "avatar.jpg",
    };

    const LINKS = [
      {
        label: "Watch on Youtube",
        subtitle: "Mahkus",
        url: "https://youtube.com/@themahkus",
        emoji: "▶️",
      },
      {
        label: "Matic Robots",
        subtitle: "Referral link",
        url: "http://referrals.maticrobots.com/maticrobots/u/mahkus11?sub=maticrobots",
        emoji: "🤖",
      },
      {
        label: "Starlink",
        subtitle: "Referral link",
        url: "https://starlink.com/?referral=RC-3867860-40768-78",
        emoji: "🛰️",
      },
      {
        label: "Tesla",
        subtitle: "Referral link",
        url: "https://ts.la/mark51041",
        emoji: "🚗",
      },
      {
        label: "Questions?",
        subtitle: "mahkusvideo@gmail.com",
        url: "mailto:mahkusvideo@gmail.com",
        emoji: "✉️",
      },
    ];
    // ===== END CONFIG =====

    document.querySelector("h1").textContent = PROFILE.name;
    document.querySelector(".bio").textContent = PROFILE.bio;
    const avatarImg = document.querySelector(".avatar img");
    if (avatarImg && PROFILE.avatar) {
      avatarImg.src = PROFILE.avatar;
      avatarImg.alt = PROFILE.name;
    }
    document.title = PROFILE.name + " — Links";

    const nav = document.getElementById("links");
    for (const item of LINKS) {
      const a = document.createElement("a");
      a.className = "link";
      a.href = item.url;
      if (!item.url.startsWith("mailto:")) {
        a.target = "_blank";
        a.rel = "noopener noreferrer";
      }
      a.innerHTML =
        '<span class="emoji" aria-hidden="true">' + (item.emoji || "🔗") + "</span>" +
        '<span class="copy"><span class="label"></span>' +
        (item.subtitle ? '<span class="sub"></span>' : "") +
        "</span>";
      a.querySelector(".label").textContent = item.label;
      const sub = a.querySelector(".sub");
      if (sub) sub.textContent = item.subtitle;
      nav.appendChild(a);
    }
  </script>
</body>
</html>
